# Rebuild the Deals Daily Dashboard once a day and publish it to Google Drive
# (stable filename deals_dashboard.html).
#
# Scheduled for 07:00 UTC (09:00 Madrid in summer, 08:00 in winter) — but note
# GitHub delays cron jobs under load, often by hours, so treat this as "runs
# once every morning", not an exact time. An earlier version guarded on the
# clock reading exactly 09:00 Madrid; with GitHub's drift the guard skipped
# every scheduled run (green but no build), so it was removed.
#
# Required repository secrets:
#   SEEDTAG_TOKEN_JSON — contents of ~/.config/seedtag/token.json (Google OAuth
#                        authorized-user file; the refresh token lets the build
#                        mint Trino ID tokens headlessly)
#   DRIVE_SA_JSON      — contents of the Drive service-account JSON
#                        (prj-jdpa-…json, same one adex_demand_dashboard uses)

name: Daily deals dashboard

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Write credentials
        run: |
          umask 077
          printf '%s' "$SEEDTAG_TOKEN_JSON" > "$RUNNER_TEMP/token.json"
          printf '%s' "$DRIVE_SA_JSON" > "$RUNNER_TEMP/drive_sa.json"
        env:
          SEEDTAG_TOKEN_JSON: ${{ secrets.SEEDTAG_TOKEN_JSON }}
          DRIVE_SA_JSON: ${{ secrets.DRIVE_SA_JSON }}

      - name: Build and upload to Drive
        run: uv run python generate_report.py --upload
        env:
          SEEDTAG_TOKEN_PATH: ${{ runner.temp }}/token.json
          DRIVE_SA_JSON: ${{ runner.temp }}/drive_sa.json

      - name: Keep HTML as run artifact (debugging)
        uses: actions/upload-artifact@v4
        with:
          name: deals_dashboard
          path: |
            output/deals_dashboard.html
            output/deals_daily.csv
          retention-days: 7
